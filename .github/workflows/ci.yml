# Archival CI: typecheck + production build, plus gating browser checks against
# the isolated customer fixture. The retired SPA must not compose with the live
# backend, admin application, or marketing site.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck + production build. The only sibling dependency is the locked
  # browser/server harness exposed by @fiducia/test-config.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          path: fiducia-customer-ui.web
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-test-config
          ref: 825220281fdc16bbf47a035177001d2fe29bdabf
          path: fiducia-test-config
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.17.0"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: fiducia-customer-ui.web
      - run: npm audit --audit-level=high
        working-directory: fiducia-customer-ui.web
      - run: npm run check
        working-directory: fiducia-customer-ui.web
      - run: npm run build
        working-directory: fiducia-customer-ui.web
      - name: config secret guard (no credentials in public config.js)
        run: npm run test:guard
        working-directory: fiducia-customer-ui.web

  # The archived image is verification evidence, not a deployment artifact.
  # Build it from an isolated checkout so that contract cannot silently rot.
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: build archived customer image
        run: docker build --tag fiducia-customer-ui:ci .

  # Full-browser regression checks for the preserved standalone shell. The
  # fixture exposes only the sanitized customer BFF contract and carries no
  # production identity or credential authority. Playwright and Puppeteer run as
  # independent lanes (both under node --test) so a single Chrome build verifies
  # the portal through two engines — a regression that only one driver observes
  # still fails CI.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [playwright, puppeteer]
    name: browser-e2e (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          path: fiducia-customer-ui.web
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-test-config
          ref: 825220281fdc16bbf47a035177001d2fe29bdabf
          path: fiducia-test-config
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.17.0"
      - id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: fiducia-customer-ui.web
      - name: browser tests (${{ matrix.engine }})
        working-directory: fiducia-customer-ui.web
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser:${{ matrix.engine }}
