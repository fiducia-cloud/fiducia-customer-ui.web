# Server block for the standalone customer-portal image (see Dockerfile); it
# replaces /etc/nginx/conf.d/default.conf. When the bundle is instead served by
# fiducia-backend.rs in compatibility mode, that service is the header
# authority and this file is unused.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers for every response. NOTE: nginx `add_header` is NOT
    # inherited into location blocks that declare their own add_header, so
    # caching below uses `expires` instead of add_header on purpose.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Executable code is same-origin only. The optional sync module is checked
    # by the application against window.location.origin before dynamic import;
    # cross-origin Supabase/API connections remain HTTPS/WSS only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Bundle filenames are fixed (assets/customer.js), not content-hashed, and
    # /config.js is swapped at deploy time without a rebuild: everything must
    # revalidate (ETag/304) so a redeploy or config rotation is picked up
    # immediately. Do not add long-lived caching while filenames are unhashed.
    expires -1;

    # SPA routes (/app, /app/auth, ...) all resolve to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
